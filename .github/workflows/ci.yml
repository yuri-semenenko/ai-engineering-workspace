name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Drift guard (canon -> mirror in sync, codex skills valid)
        run: bash scripts/sync-codex-references.sh --check

      - name: Repository contract guard + its fixtures
        run: bash scripts/test-check-repository-contract.sh

      - name: Shell syntax check
        run: |
          status=0
          while IFS= read -r f; do
            bash -n "$f" || { echo "SYNTAX ERROR: $f"; status=1; }
          done < <(git ls-files '*.sh')
          exit $status

      - name: Installers report an unfilled persona
        run: bash scripts/test-installer-persona-outcomes.sh

      - name: Copilot workspace delivers the contract pair safely
        run: bash scripts/test-copilot-workspace-contract.sh

      - name: Persona wizard produces no leftover placeholders
        run: |
          bash scripts/create-persona.sh --defaults
          if grep -R '{{' persona/persona.md persona/CLAUDE.md; then
            echo "Unfilled placeholders in generated persona"; exit 1
          fi

      - name: Committed model fields name a tier, not a version
        run: bash scripts/test-check-model-tiers.sh

      - name: Recommended skills reference only shipped skills
        run: bash scripts/check-recommended-skills.sh

      - name: Claude Code installer smoke test
        run: |
          home="$(mktemp -d)"
          HOME="$home" bash claude-code/scripts/install.macos-linux.sh < /dev/null
          test -L "$home/.claude"
          test -f "$home/.claude/CLAUDE.md"
          test -f "$home/.claude/settings.json"
          test -f "$home/persona.md"

      - name: Codex installer smoke test
        run: |
          codex_home="$(mktemp -d)"
          out="$(bash codex/scripts/install.macos-linux.sh "$codex_home")"
          case "$out" in *'Persona: installed from'*) ;; *) echo "installer did not report the filled persona"; printf '%s\n' "$out"; exit 1;; esac
          test -f "$codex_home/AGENTS.md"
          test -f "$codex_home/references/persona.md"
          test -d "$codex_home/skills"
          if grep -R '{{' "$codex_home/references/persona.md"; then
            echo "Installed persona still has placeholders"; exit 1
          fi

      - name: Copilot installer smoke test
        run: |
          cop_home="$(mktemp -d)"; ws="$(mktemp -d)"
          out="$(bash copilot/scripts/install.macos-linux.sh "$cop_home" "$ws")"
          case "$out" in *'Persona: installed from'*) ;; *) echo "installer did not report the filled persona"; printf '%s\n' "$out"; exit 1;; esac
          # The workspace was installed, so the hint about skipping it must not fire.
          case "$out" in *'For repository-level setup'*) echo "installer offered workspace setup it had already done"; exit 1;; esac
          test -f "$cop_home/.copilot/copilot-instructions.md"
          test -f "$ws/.github/copilot-instructions.md"
          # The contract and its Claude Code import ship as a pair (ADR-0014):
          # AGENTS.md alone leaves a seeded repo with nothing for Claude.
          test -f "$ws/AGENTS.md"
          test -f "$ws/CLAUDE.md"
          grep -qx '@AGENTS.md' "$ws/CLAUDE.md"
          if grep -R '{{' "$cop_home/.copilot/copilot-instructions.md"; then
            echo "Installed Copilot instructions still have placeholders"; exit 1
          fi

      - name: Gemini CLI installer smoke test
        run: |
          gem_home="$(mktemp -d)"
          out="$(bash gemini/scripts/install.macos-linux.sh "$gem_home")"
          case "$out" in *'Persona: installed from'*) ;; *) echo "installer did not report the filled persona"; printf '%s\n' "$out"; exit 1;; esac
          test -f "$gem_home/GEMINI.md"
          test -d "$gem_home/commands"
          test -f "$gem_home/settings.json"
          # Every port the repo ships must land, not "enough of them": a
          # threshold passes while an installer silently drops files.
          expected="$(ls -1 gemini/commands/*.toml | wc -l | tr -d ' ')"
          installed="$(ls -1 "$gem_home"/commands/*.toml | wc -l | tr -d ' ')"
          if [ "$installed" != "$expected" ]; then
            echo "Installed $installed of $expected Gemini commands"; exit 1
          fi
          if grep -R '{{' "$gem_home/GEMINI.md"; then
            echo "Installed GEMINI.md still has placeholders"; exit 1
          fi

  # The job above covers the .sh side only. Every one of those scripts has a
  # PowerShell port that a Windows user actually runs, so run those too.
  verify-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Windows script suite (drift guard, persona wizard, installers)
        shell: pwsh
        # The runner image provides bash and jq. The degraded-path check hides
        # jq in an isolated Bash PATH, so all three checks must actually run.
        run: .\scripts\test-windows.ps1 -RequireChecks model-tier-fields,repository-contract,install-copilot-contract,hook-scripts,hook-scripts-without-jq
